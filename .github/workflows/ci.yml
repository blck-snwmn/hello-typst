name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk

      - name: Install tools
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1

      - name: Build
        run: mise run build
        env:
          TYPST_FONT: Noto Sans CJK JP
